<!DOCTYPE html>

<html lang="cs-cz">
    <head>
        <script type="text/javascript" src="js/beamAnalytics.js" async></script>
        <script type="text/javascript" data-goatcounter="https://stats.hadejkde.cz/count" src="js/goatCounter.js" async></script>

        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Česká obdoba hry GeoGuessr">
        <meta name="author" content="Martin Hruboš">
        <meta name="robots" content="noindex, nofollow">
        <link rel="canonical" href="https://hadejkde.cz/hra">

        <title>Hádej sakra - Český GeoGuessr</title>
        <script src="js/theme.js"></script>

        <link rel="stylesheet" href="css/fonty.css" type="text/css">
        <link rel="stylesheet" href="css/styly.css" type="text/css">
        <link rel="stylesheet" href="css/menu-hra.css" type="text/css">
        <link rel="stylesheet" href="css/mapa.css" type="text/css">
        <link rel="stylesheet" href="css/liquid-glass.css" type="text/css">
        <link rel="stylesheet" href="css/multiplayer.css" type="text/css">

        <!-- FontAwesome CDN Link -->
        <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.4.0/css/all.css">

        <!-- Google emoji -->
        <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap" rel="stylesheet">
        
        <!-- Mapy.cz JS Panorama -->
        <script type="text/javascript" src='https://api.mapy.com/js/panorama/v1/panorama.js'></script>

        <!-- Leaflet CDN Link -->
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
        <!-- Leaflet.PointInPolygon CDN Link -->
        <script src="https://cdn.jsdelivr.net/gh/hayeswise/Leaflet.PointInPolygon@v1.0.0/wise-leaflet-pip.js"></script>

        <!-- RequireJS CDN Link -->
        <!-- <script src="https://requirejs.org/docs/release/2.3.6/minified/require.js"></script> -->
    </head>

    <body class="game-page">
        <div id="cerveneOkraje"></div>

        <header class="navigation">
            <div class="navigation-content">
                <ul class="game-info">
                    <li class="skore">
                        <span id="celkove-skore">CELKOVÉ SKÓRE: 0</span>
                    </li>
                    <li class="cas">
                        <span id="casomira"></span>
                    </li>
                    <li class="mod-kolo">
                        <span id="mod">MÓD: mód</span>
                        <span id="kolo">KOLO: 1/20</span>
                    </li>
                </ul>
                <button class="theme-toggle game-theme-toggle" type="button" data-theme-toggle aria-label="Přepnout na tmavý režim" aria-pressed="false" title="Tmavý režim">
                    <span class="theme-toggle-icon" aria-hidden="true">☾</span>
                    <span class="theme-toggle-label">Tmavý režim</span>
                </button>
                <button class="multiplayer-open" id="multiplayerOpen" type="button" title="Hrát s kamarádem">
                    <i class="fa-solid fa-people-arrows-left-right" aria-hidden="true"></i>
                    <span>HRÁT SPOLU</span>
                </button>
                <span id="multiplayerOpponentScore" class="multiplayer-opponent-score" hidden aria-live="polite">SOUPEŘ: -</span>
            </div>
        </header>

        <dialog id="multiplayerDialog" aria-labelledby="multiplayerTitle">
            <div class="multiplayer-dialog-content">
                <div class="multiplayer-heading">
                    <h2 id="multiplayerTitle">Hrát spolu</h2>
                    <button id="multiplayerClose" type="button" class="multiplayer-icon-button" aria-label="Zavřít multiplayer" title="Zavřít">
                        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                    </button>
                </div>
                <div class="multiplayer-room-options">
                    <section>
                        <h3>Vytvořit místnost</h3>
                        <button id="multiplayerCreate" type="button">Vytvořit místnost</button>
                        <div id="multiplayerRoomInvite" class="multiplayer-room-invite" hidden>
                            <output id="multiplayerRoomCode" aria-label="Kód místnosti"></output>
                            <button id="multiplayerCopy" type="button" class="multiplayer-icon-button" aria-label="Zkopírovat kód místnosti" title="Zkopírovat kód">
                                <i class="fa-regular fa-copy" aria-hidden="true"></i>
                            </button>
                        </div>
                    </section>
                    <section>
                        <h3>Připojit se</h3>
                        <label for="multiplayerCode">Kód místnosti</label>
                        <div class="multiplayer-join-row">
                            <input id="multiplayerCode" type="text" maxlength="6" inputmode="text" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="Zadej kód">
                            <button id="multiplayerJoin" type="button">Připojit</button>
                        </div>
                    </section>
                </div>
                <p id="multiplayerStatus" role="status" aria-live="polite">Hostitel vytvoří místnost a pošle soupeři její kód.</p>
                <button id="multiplayerDisconnect" type="button" class="multiplayer-disconnect" hidden>Ukončit místnost</button>
            </div>
        </dialog>

        <article>
            <div>
                <div class="panorama-kontejner">
                    <div class="panorama"></div>
                    <div class="loading">
                        <div class="kolecko"></div>
                        <p id="loadingText">NAČÍTÁM PANORAMA, POČKEJ PROSÍM.</p>
                    </div>
                </div>

                <div id="mapa-parent">
                    <div id="mapa-kontejner">
                        <div id="mapa"></div>

                        <button type="button" id="btnPotvrdit" tabindex="-1">POTVRDIT</button>

                        <div id="neniOdhadBod">NEBYL OZNAČEN ODHAD BOD!</div>

                        <div id="napovedy">
                            <button type="button" id="vzdalenostHelp" class="napoveda" title="Vzdálenost - klávesa 1" tabindex="-1">
                                <img src="img/napovedy/vzdalenost.svg" alt="vzdálenost">
                            </button>
            
                            <button type="button" id="smerHelp" class="napoveda" title="Směr - klávesa 2" tabindex="-1">
                                <img src="img/napovedy/smer.svg" alt="směr">
                            </button>
            
                            <button type="button" id="kruhHelp" class="napoveda" title="Kruh - klávesa 3" tabindex="-1">
                                <img src="img/napovedy/kruh.svg" alt="kruh">
                            </button>
                        </div>

                        <div id="velikosti">
                            <button type="button" id="zvetsitVelikost" class="velikost" title="Zvětšit okno mapy" aria-label="Zvětšit okno mapy" tabindex="-1">
                                <i class="fa-solid fa-expand"></i>
                            </button>
            
                            <button type="button" id="zmensitVelikost" class="velikost" title="Zmenšit okno mapy" aria-label="Zmenšit okno mapy" tabindex="-1">
                                <i class="fa-solid fa-compress"></i>
                            </button>
            
                            <button type="button" id="pinVelikost" class="velikost" title="Připnout velikost okna mapy" aria-label="Připnout velikost okna mapy" tabindex="-1">
                                <i class="fa-solid fa-thumbtack fa-rotate-90"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <button type="button" id="resetPanorama" title="Vrátit se na začátek aktuálního kola" tabindex="-1">
                    <i class="fa-solid fa-rotate-left" aria-hidden="true"></i>
                </button>
            </div>
        </article>


        <!-- SKRIPTY -->
        <script type="text/javascript" src="js/mapy-config.js"></script>
        <script type="text/javascript" src="js/hra/nastaveni.js"></script>
        
        <script type="text/javascript" src="js/hra/casovac.js"></script>
        <script type="text/javascript" src="js/hra/mapa.js"></script>
        <script type="text/javascript" src="js/hra/panorama.js"></script>
        <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
        <script type="text/javascript" src="js/hra/multiplayer.js"></script>
    </body>
</html>
