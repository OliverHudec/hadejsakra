<!DOCTYPE html>

<html lang="cs-cz">
    <head>
        <script type="text/javascript" src="js/beamAnalytics.js" async></script>
        <script type="text/javascript" data-goatcounter="https://stats.hadejkde.cz/count" src="js/goatCounter.js" async></script>

        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Česká obdoba hry GeoGuessr">
        <meta name="author" content="Martin Hruboš">
        <meta name="robots" content="noindex, nofollow">
        <link rel="canonical" href="https://hadejkde.cz/hra">

        <title>Hádej sakra - Český GeoGuessr</title>
        <script src="js/theme.js"></script>

        <link rel="stylesheet" href="css/fonty.css" type="text/css">
        <link rel="stylesheet" href="css/styly.css" type="text/css">
        <link rel="stylesheet" href="css/menu-hra.css" type="text/css">
        <link rel="stylesheet" href="css/mapa.css" type="text/css">
        <link rel="stylesheet" href="css/liquid-glass.css" type="text/css">
        <link rel="stylesheet" href="css/multiplayer.css" type="text/css">
        <link rel="stylesheet" href="css/game-tailwind.css" type="text/css">

        <!-- FontAwesome CDN Link -->
        <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.4.0/css/all.css">

        <!-- Google emoji -->
        <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap" rel="stylesheet">
        
        <!-- Mapy.cz JS Panorama -->
        <script type="text/javascript" src='https://api.mapy.com/js/panorama/v1/panorama.js'></script>

        <!-- Leaflet CDN Link -->
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
        <!-- Leaflet.PointInPolygon CDN Link -->
        <script src="https://cdn.jsdelivr.net/gh/hayeswise/Leaflet.PointInPolygon@v1.0.0/wise-leaflet-pip.js"></script>

        <!-- RequireJS CDN Link -->
        <!-- <script src="https://requirejs.org/docs/release/2.3.6/minified/require.js"></script> -->
    </head>

    <body class="game-page min-h-screen overflow-hidden bg-neutral-950 text-neutral-100 antialiased">
        <div id="cerveneOkraje"></div>

        <header class="navigation !fixed !inset-x-0 !top-0 !z-[99] !shadow-none">
            <div class="navigation-content !relative !mx-auto !grid !min-h-[76px] !w-full !max-w-[1800px] !grid-cols-[1fr_auto_1fr] !items-center !gap-6 !px-4 sm:!px-8">
                <ul class="game-info !col-span-3 !row-start-1 !grid !w-full !grid-cols-[1fr_auto_1fr] !items-center !gap-4 !py-3">
                    <li class="skore !m-0 !min-w-0">
                        <span id="celkove-skore" class="!font-sans !text-[10px] !font-semibold !uppercase !tracking-[.16em]">CELKOVÉ SKÓRE: 0</span>
                    </li>
                    <li class="cas !relative !left-auto !m-0 !w-auto !translate-x-0 !border-0 !bg-transparent !p-0 !text-center !shadow-none">
                        <span id="casomira" class="!font-sans !text-2xl !font-semibold !tabular-nums !tracking-tight"></span>
                    </li>
                    <li class="mod-kolo !m-0 !justify-self-end !gap-2 sm:!gap-5">
                        <span id="mod" class="!font-sans !text-[10px] !font-medium !uppercase !tracking-[.1em] !text-neutral-300">MÓD: mód</span>
                        <span id="kolo" class="!font-sans !text-[10px] !font-medium !uppercase !tracking-[.1em] !text-neutral-300">KOLO: 1/20</span>
                    </li>
                </ul>
                <div class="game-toolbar !absolute !right-4 !top-1/2 !z-[102] !flex !-translate-y-1/2 !items-center !gap-2 sm:!right-8">
                <button class="theme-toggle game-theme-toggle !static !min-h-9 !translate-y-0 !rounded-none !bg-transparent !px-3 !py-2 !text-[10px] !uppercase !tracking-wider !shadow-none" type="button" data-theme-toggle aria-label="Přepnout na tmavý režim" aria-pressed="false" title="Tmavý režim">
                    <span class="theme-toggle-icon" aria-hidden="true">☾</span>
                    <span class="theme-toggle-label">Tmavý režim</span>
                </button>
                <button class="multiplayer-open !min-h-9 !rounded-none !px-3 !text-[10px] !font-semibold !uppercase !tracking-wider !shadow-none" id="multiplayerOpen" type="button" title="Hrát s kamarádem">
                    <i class="fa-solid fa-people-arrows-left-right" aria-hidden="true"></i>
                    <span>SPOLU</span>
                </button>
                </div>
                <span id="multiplayerOpponentScore" class="multiplayer-opponent-score !absolute !right-4 !top-[calc(100%+8px)] !border-l-0 !px-3 !py-2 !text-[10px] !uppercase !tracking-wider sm:!right-8" hidden aria-live="polite">SOUPEŘ: -</span>
            </div>
        </header>

        <dialog id="multiplayerDialog" class="!max-h-[90vh] !rounded-none !shadow-none" aria-labelledby="multiplayerTitle">
            <div class="multiplayer-dialog-content !gap-7 !p-7 sm:!p-10">
                <div class="multiplayer-heading">
                    <h2 id="multiplayerTitle" class="!text-3xl !font-bold !tracking-[-.06em]">Společná hra</h2>
                    <button id="multiplayerClose" type="button" class="multiplayer-icon-button !rounded-none" aria-label="Zavřít multiplayer" title="Zavřít">
                        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                    </button>
                </div>
                <div class="multiplayer-room-options">
                    <section>
                        <h3 class="!text-xs !font-medium !uppercase !tracking-[.14em] !text-neutral-400">Solo</h3>
                        <button id="multiplayerSolo" type="button">Začít bez soupeře</button>
                        <button id="multiplayerStart" type="button" disabled hidden>Spustit hru</button>
                    </section>
                    <section>
                        <h3 class="!text-xs !font-medium !uppercase !tracking-[.14em] !text-neutral-400">Hostitel</h3>
                        <button id="multiplayerCreate" type="button">Vytvořit místnost</button>
                        <div id="multiplayerRoomInvite" class="multiplayer-room-invite" hidden>
                            <output id="multiplayerRoomCode" aria-label="Kód místnosti"></output>
                            <button id="multiplayerCopy" type="button" class="multiplayer-icon-button !rounded-none" aria-label="Zkopírovat kód místnosti" title="Zkopírovat kód">
                                <i class="fa-regular fa-copy" aria-hidden="true"></i>
                            </button>
                        </div>
                    </section>
                    <section>
                        <h3 class="!text-xs !font-medium !uppercase !tracking-[.14em] !text-neutral-400">Připojit</h3>
                        <label for="multiplayerCode">Kód místnosti</label>
                        <div class="multiplayer-join-row">
                            <input id="multiplayerCode" type="text" maxlength="6" inputmode="text" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="Zadej kód">
                            <button id="multiplayerJoin" type="button">Připojit</button>
                        </div>
                    </section>
                </div>
                <p id="multiplayerStatus" role="status" aria-live="polite">Nastavení určuje hostitel.</p>
                <button id="multiplayerDisconnect" type="button" class="multiplayer-disconnect" hidden>Ukončit místnost</button>
            </div>
        </dialog>

        <article>
            <div>
                <div class="panorama-kontejner !relative !h-svh !w-full !justify-center">
                    <div class="panorama !h-full !w-full"></div>
                    <div class="loading !z-[98] !gap-6">
                        <div class="kolecko"></div>
                        <p id="loadingText">NAČÍTÁM PANORAMA, POČKEJ PROSÍM.</p>
                    </div>
                </div>

                <div id="mapa-parent">
                    <div id="mapa-kontejner" class="!rounded-none !shadow-none">
                        <div id="mapa"></div>

                    <button type="button" id="btnPotvrdit" class="!rounded-none !border-0 !font-sans !text-xs !font-semibold !uppercase !tracking-[.14em]" tabindex="-1">POTVRDIT</button>

                        <div id="neniOdhadBod">NEBYL OZNAČEN ODHAD BOD!</div>

                        <div id="napovedy">
                            <button type="button" id="vzdalenostHelp" class="napoveda" title="Vzdálenost - klávesa 1" tabindex="-1">
                                <img src="img/napovedy/vzdalenost.svg" alt="vzdálenost">
                            </button>
            
                            <button type="button" id="smerHelp" class="napoveda" title="Směr - klávesa 2" tabindex="-1">
                                <img src="img/napovedy/smer.svg" alt="směr">
                            </button>
            
                            <button type="button" id="kruhHelp" class="napoveda" title="Kruh - klávesa 3" tabindex="-1">
                                <img src="img/napovedy/kruh.svg" alt="kruh">
                            </button>
                        </div>

                        <div id="velikosti">
                            <button type="button" id="zvetsitVelikost" class="velikost" title="Zvětšit okno mapy" aria-label="Zvětšit okno mapy" tabindex="-1">
                                <i class="fa-solid fa-expand"></i>
                            </button>
            
                            <button type="button" id="zmensitVelikost" class="velikost" title="Zmenšit okno mapy" aria-label="Zmenšit okno mapy" tabindex="-1">
                                <i class="fa-solid fa-compress"></i>
                            </button>
            
                            <button type="button" id="pinVelikost" class="velikost" title="Připnout velikost okna mapy" aria-label="Připnout velikost okna mapy" tabindex="-1">
                                <i class="fa-solid fa-thumbtack fa-rotate-90"></i>
                            </button>
                        </div>
                    </div>
                    <section id="multiplayerRoundResults" class="multiplayer-round-results !rounded-none !shadow-none" hidden aria-live="polite">
                        <h2 id="multiplayerRoundTitle" class="!text-2xl !font-bold !tracking-[-.05em]"></h2>
                        <table>
                            <thead>
                                <tr><th>Hráč</th><th>Body v kole</th><th>Celkem</th></tr>
                            </thead>
                            <tbody>
                                <tr><th scope="row">Ty</th><td id="multiplayerLocalRoundScore">Čeká na tip</td><td id="multiplayerLocalTotalScore">—</td></tr>
                                <tr><th scope="row">Soupeř</th><td id="multiplayerRemoteRoundScore">Čeká na tip</td><td id="multiplayerRemoteTotalScore">—</td></tr>
                            </tbody>
                        </table>
                        <p id="multiplayerRoundStatus"></p>
                    </section>
                </div>

                <button type="button" id="resetPanorama" class="!h-11 !w-11 !rounded-none !shadow-none" title="Vrátit se na začátek aktuálního kola" tabindex="-1">
                    <i class="fa-solid fa-rotate-left" aria-hidden="true"></i>
                </button>
            </div>
        </article>


        <!-- SKRIPTY -->
        <script type="text/javascript" src="js/mapy-config.js"></script>
        <script type="text/javascript" src="js/hra/nastaveni.js"></script>
        
        <script type="text/javascript" src="js/hra/casovac.js"></script>
        <script type="text/javascript" src="js/hra/mapa.js"></script>
        <script type="text/javascript" src="js/hra/panorama.js"></script>
        <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
        <script type="text/javascript" src="js/hra/multiplayer.js"></script>
    </body>
</html>
